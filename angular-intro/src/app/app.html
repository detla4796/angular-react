<main class="card">
  <h1>Мой предмет</h1>
  <p>Предмет: {{ subject }}</p>
  <p>Преподаватель: {{ teacher }}</p>
  <p>Мы изучаем веб-разработку</p>

  <button (click)="toggleTopics()">
    {{ showTopics() ? 'Скрыть темы' : 'Показать темы' }}
  </button>

  @if (showTopics()) {
    <ul>
      <li>Компоненты</li>
      <li>Шаблоны</li>
      <li>События</li>
    </ul>
  }
</main>
